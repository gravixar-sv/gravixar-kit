# Stages a package for release when a tag `<package>-v<version>` is pushed: `theme-v0.1.1` stages @gravixar/theme
# 0.1.1, `forms-v0.1.1` stages @gravixar/forms 0.1.1. Each package has its own stage-only trusted publisher on
# npmjs.com, pointing at this workflow. Nothing goes public from here: the
# Trusted Publisher on npmjs.com is stage-only ("Allow npm publish" unchecked), so this job can only stage, and the
# version waits until a maintainer approves it with two-factor authentication, on npmjs.com (Staged Packages →
# Approve) or with `npm stage approve <stage-id>`. A compromised CI or GitHub account can't publish on its own.
#
# The job proves who it is with a GitHub OIDC token (`id-token: write`), so no npm token is stored anywhere.
# `npm stage publish` needs npm 11.15.0 or later, so the job installs a pinned npm instead of relying on the one
# bundled with Node.
#
# A package's first version is published by hand, because npm configures a trusted publisher from an existing
# package's settings. A tag for a version that is already on npm is skipped rather than failed.
#
# To release: bump `version` in packages/<package>/package.json through a PR, merge it, then
#   git tag <package>-v<version> && git push origin <package>-v<version>
# and approve the staged version on npmjs.com.

name: Publish

on:
  push:
    tags: ["theme-v*", "forms-v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` key: pnpm/action-setup reads `packageManager` from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # 11.15.0 is the first npm with `npm stage publish`; pinned so a release never depends on Node's bundled npm.
      - run: npm install -g npm@11.20.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # The package comes from a fixed list, never straight from the tag, so a tag can't point the job anywhere else.
      - name: The tag names a package and its version
        id: version
        run: |
          case "${GITHUB_REF_NAME}" in
            theme-v*) package=theme ;;
            forms-v*) package=forms ;;
            *) echo "::error::Tag ${GITHUB_REF_NAME} names no package"; exit 1 ;;
          esac
          name="$(node -p "require('./packages/${package}/package.json').name")"
          version="$(node -p "require('./packages/${package}/package.json').version")"
          if [ "${package}-v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match ${name} ${version}"
            exit 1
          fi
          {
            echo "package=${package}"
            echo "name=${name}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Skip a version that is already published
        id: published
        run: |
          if npm view "${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "::notice::${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }} is already on npm; nothing to stage"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage for approval
        if: steps.published.outputs.exists == 'false'
        working-directory: packages/${{ steps.version.outputs.package }}
        run: |
          npm stage publish . --access public
          {
            echo "### ${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }} is staged, not public"
            echo "Approve it with two-factor authentication on npmjs.com (Staged Packages → Approve),"
            echo "or run \`npm stage list ${{ steps.version.outputs.name }}\` and \`npm stage approve <stage-id>\`."
          } >> "$GITHUB_STEP_SUMMARY"
