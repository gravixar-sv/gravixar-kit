# Stages @gravixar/theme for release when a tag `theme-v<version>` is pushed. Nothing goes public from here: the
# Trusted Publisher on npmjs.com is stage-only ("Allow npm publish" unchecked), so this job can only stage, and the
# version waits until a maintainer approves it with two-factor authentication, on npmjs.com (Staged Packages →
# Approve) or with `npm stage approve <stage-id>`. A compromised CI or GitHub account can't publish on its own.
#
# The job proves who it is with a GitHub OIDC token (`id-token: write`), so no npm token is stored anywhere.
# `npm stage publish` needs npm 11.15.0 or later, so the job installs a pinned npm instead of relying on the one
# bundled with Node.
#
# The first version (0.1.0) was published by hand, because npm configures a trusted publisher from an existing
# package's settings. A tag for a version that is already on npm is skipped rather than failed.
#
# To release: bump `version` in packages/theme/package.json through a PR, merge it, then
#   git tag theme-v<version> && git push origin theme-v<version>
# and approve the staged version on npmjs.com.

name: Publish

on:
  push:
    tags: ["theme-v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` key: pnpm/action-setup reads `packageManager` from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # 11.15.0 is the first npm with `npm stage publish`; pinned so a release never depends on Node's bundled npm.
      - run: npm install -g npm@11.20.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: The tag names the package's version
        id: version
        run: |
          version="$(node -p "require('./packages/theme/package.json').version")"
          if [ "theme-v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match @gravixar/theme ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Skip a version that is already published
        id: published
        run: |
          if npm view "@gravixar/theme@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "::notice::@gravixar/theme@${{ steps.version.outputs.version }} is already on npm; nothing to stage"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage for approval
        if: steps.published.outputs.exists == 'false'
        working-directory: packages/theme
        run: |
          npm stage publish . --access public
          {
            echo "### @gravixar/theme@${{ steps.version.outputs.version }} is staged, not public"
            echo "Approve it with two-factor authentication on npmjs.com (Staged Packages → Approve),"
            echo "or run \`npm stage list @gravixar/theme\` and \`npm stage approve <stage-id>\`."
          } >> "$GITHUB_STEP_SUMMARY"
